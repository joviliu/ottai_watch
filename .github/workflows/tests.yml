name: Source checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sh tools/test.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r watchface/requirements.txt
      - run: python watchface/test_frame.py && python watchface/test_ui.py && python watchface/build.py
